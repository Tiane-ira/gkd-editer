name: CI Build Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Clean proxy settings for CI
        run: |
          sed -i '/systemProp.http/d' gradle.properties || true
          sed -i '/systemProp.https/d' gradle.properties || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run assembleDebug and Test
        run: ./gradlew assembleDebug test --stacktrace
